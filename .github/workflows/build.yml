# Build, test and clippy on every push and pull request. On a version tag
# such as v0.1.0, also attach notefetch.exe and notefetch.zip to a draft
# release, to be checked and published by hand. TASKS.md milestone 7.
#
# Output stays plain text: no colour codes (CLAUDE.md).

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "The tag ${{ github.ref_name }} does not match version $version in Cargo.toml."
          }

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\notefetch.exe dist\notefetch.exe
          Compress-Archive -Path dist\notefetch.exe -DestinationPath dist\notefetch.zip

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist\notefetch.exe dist\notefetch.zip --draft --title "NoteFetch ${{ github.ref_name }}" --generate-notes
