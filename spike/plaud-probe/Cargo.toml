[package]
name = "plaud-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls", "http2", "system-proxy", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
url = "2.5.8"
